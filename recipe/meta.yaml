{% set name = "wavespectra" %}
{% set version = "4.7.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: acc91ad29192d2876e9138ff20f775fa2a74b528611f454c3dacc3ef7c87e5e3


build:
  number: 1
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    # Compilers are named 'c', 'cxx' and 'fortran'.
    - {{ compiler('fortran') }}
    - {{ stdlib("c") }}
  host:
    - python
    - pip
    # pyproject.toml sets build-backend = "setuptools.build_meta" with
    # requires = ["numpy", "setuptools"]. setuptools used to arrive implicitly
    # via pytest-runner and via pip, but pip's python>=3.13 build no longer
    # depends on it, so it must be requested explicitly.
    - setuptools
    - numpy
  run:
    - python
    - click
    - cmocean
    - dask
    - gcsfs
    - fsspec
    - matplotlib-base
    - numpy
    - pandas
    - python-dateutil
    - pyyaml
    - sortedcontainers
    - scipy
    - xarray
    - zarr

test:
  imports:
    - wavespectra
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/wavespectra/wavespectra
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Python library for ocean wave spectra
  description: |
    Wavespectra is an open source project for working with ocean wave spectral data. 
    The library is built on top of xarray, leveraging from xarray’s labelled 
    multi-dimensional arrays and making dealing with wave spectra simple and fast..
  doc_url: https://wavespectra.readthedocs.io/en/latest/
  dev_url: https://github.com/wavespectra/wavespectra

extra:
  recipe-maintainers:
    - RubendeBruin
    - rafa-guedes
